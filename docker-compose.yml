version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: dfs_projections_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dfs_projections

volumes:
  mongodb_data:
    driver: local

